[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inertial-belief-propagation"
version = "0.1.0"
description = "Unfiltered 8+1 local block Gaussian belief propagation with independent adaptive inertia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "numba>=0.59,<1"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
inertial-bp = "inertial_bp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
