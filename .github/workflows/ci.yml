name: Reproduction checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-replay.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_saved_results.py
      - run: python scripts/verify_manifest.py
      - run: python scripts/verify_more_experiments.py
  more-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make -C ibp_more_experiments
      - run: make -C ibp_more_experiments smoke
      - run: python ibp_more_experiments/scripts/verify_native.py
